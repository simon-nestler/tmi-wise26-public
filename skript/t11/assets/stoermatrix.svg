<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" role="img"
     aria-labelledby="sm-titel sm-beschr" font-family="Inter, system-ui, sans-serif">
  <title id="sm-titel">Fünf Störungen gegen vier Verfahren</title>
  <desc id="sm-beschr">Matrix mit fünf Zeilen (Verdeckung, Reflexion, Metall, wechselndes Licht, Menschen im Bild) und vier Spalten (optisch outside-in, optisch inside-out, magnetisch, Infrarot und Tiefe). Gefüllte Quadrate bedeuten: die Störung trifft das Verfahren hart. Umrandete Quadrate: sie trifft es teilweise. Punkte: kaum betroffen. Verdeckung und Reflexion treffen outside-in sowie Infrarot und Tiefe hart, inside-out teilweise, magnetisch kaum. Metall trifft ausschließlich magnetisch, dort hart. Wechselndes Licht und Menschen im Bild treffen inside-out hart, outside-in teilweise, magnetisch kaum; Licht trifft Infrarot und Tiefe hart, Menschen im Bild teilweise.</desc>
  <style>
    .rahmen  { fill: none; stroke: var(--rule, #c7cdd4); stroke-width: 1.5; }
    .linie   { stroke: var(--rule, #c7cdd4); stroke-width: 1; }
    .kopf    { fill: var(--ink, #031121); font-size: 17px; font-weight: 600; text-anchor: middle; }
    .zeile   { fill: var(--ink, #031121); font-size: 19px; font-weight: 600; }
    .hart    { fill: var(--ink, #031121); }
    .teils   { fill: none; stroke: var(--ink, #031121); stroke-width: 2.5; }
    .kaum    { fill: var(--rule, #c7cdd4); }
    .legende { fill: var(--ink-soft, #5a6472); font-size: 15px; }
    .marke   { fill: #fcd430; }
  </style>

  <rect class="rahmen" x="0.75" y="0.75" width="1178.5" height="538.5"/>

  <!-- Spaltenköpfe -->
  <text class="kopf" x="430" y="34">Optisch,</text>
  <text class="kopf" x="430" y="56">outside-in</text>
  <text class="kopf" x="640" y="34">Optisch,</text>
  <text class="kopf" x="640" y="56">inside-out</text>
  <text class="kopf" x="850" y="46">Magnetisch</text>
  <text class="kopf" x="1060" y="34">Infrarot</text>
  <text class="kopf" x="1060" y="56">und Tiefe</text>
  <line class="linie" x1="0" y1="74" x2="1180" y2="74"/>

  <!-- Zeile 1: Verdeckung -->
  <rect class="marke" x="24" y="94" width="4" height="34"/>
  <text class="zeile" x="42" y="118">Verdeckung</text>
  <rect class="hart"  x="419" y="100" width="22" height="22"/>
  <rect class="teils" x="629" y="100" width="22" height="22"/>
  <circle class="kaum" cx="850" cy="111" r="4"/>
  <rect class="hart"  x="1049" y="100" width="22" height="22"/>
  <line class="linie" x1="24" y1="144" x2="1156" y2="144"/>

  <!-- Zeile 2: Reflexion -->
  <rect class="marke" x="24" y="164" width="4" height="34"/>
  <text class="zeile" x="42" y="188">Reflexion</text>
  <rect class="hart"  x="419" y="170" width="22" height="22"/>
  <rect class="teils" x="629" y="170" width="22" height="22"/>
  <circle class="kaum" cx="850" cy="181" r="4"/>
  <rect class="hart"  x="1049" y="170" width="22" height="22"/>
  <line class="linie" x1="24" y1="214" x2="1156" y2="214"/>

  <!-- Zeile 3: Metall -->
  <rect class="marke" x="24" y="234" width="4" height="34"/>
  <text class="zeile" x="42" y="258">Metall</text>
  <circle class="kaum" cx="430" cy="251" r="4"/>
  <circle class="kaum" cx="640" cy="251" r="4"/>
  <rect class="hart"  x="839" y="240" width="22" height="22"/>
  <circle class="kaum" cx="1060" cy="251" r="4"/>
  <line class="linie" x1="24" y1="284" x2="1156" y2="284"/>

  <!-- Zeile 4: wechselndes Licht -->
  <rect class="marke" x="24" y="304" width="4" height="34"/>
  <text class="zeile" x="42" y="328">Wechselndes Licht</text>
  <rect class="teils" x="419" y="310" width="22" height="22"/>
  <rect class="hart"  x="629" y="310" width="22" height="22"/>
  <circle class="kaum" cx="850" cy="321" r="4"/>
  <rect class="hart"  x="1049" y="310" width="22" height="22"/>
  <line class="linie" x1="24" y1="354" x2="1156" y2="354"/>

  <!-- Zeile 5: Menschen im Bild -->
  <rect class="marke" x="24" y="374" width="4" height="34"/>
  <text class="zeile" x="42" y="398">Menschen im Bild</text>
  <rect class="teils" x="419" y="380" width="22" height="22"/>
  <rect class="hart"  x="629" y="380" width="22" height="22"/>
  <circle class="kaum" cx="850" cy="391" r="4"/>
  <rect class="teils" x="1049" y="380" width="22" height="22"/>
  <line class="linie" x1="24" y1="424" x2="1156" y2="424"/>

  <!-- Legende -->
  <rect class="hart" x="42" y="466" width="18" height="18"/>
  <text class="legende" x="72" y="481">trifft hart</text>
  <rect class="teils" x="212" y="466" width="18" height="18"/>
  <text class="legende" x="242" y="481">trifft teilweise</text>
  <circle class="kaum" cx="432" cy="475" r="4"/>
  <text class="legende" x="452" y="481">kaum betroffen</text>
  <text class="legende" x="700" y="481">Die Matrix liest sich in beide Richtungen: vom Versagen zum Verfahren – und vom Raum zur Wahl.</text>
</svg>
