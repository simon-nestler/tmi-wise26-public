<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img"
     aria-labelledby="kap-titel kap-beschr" font-family="inherit">
  <title id="kap-titel">Kapazitiv: gemessen wird eine Ladungsverschiebung</title>
  <desc id="kap-beschr">Über der Glasfläche liegt ein gleichmäßiges elektrisches Feld. Berührt ein leitfähiger Körper die Fläche, fließt aus jeder der vier Ecken ein Strom zur Berührstelle. Aus dem Verhältnis der vier Ströme rechnet der Controller die Position aus. Die Bedingung steht daneben: Der berührende Körper muss leitfähig sein, sonst verschiebt sich keine Ladung und die Fläche bleibt stumm.</desc>

  <defs>
    <marker id="kap-pfeil" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #031121)"/>
    </marker>
  </defs>

  <style>
    .glas   { fill: var(--paper, #ffffff); stroke: var(--ink, #031121); stroke-width: 2.4; }
    .feld   { fill: none; stroke: var(--rule, #c7cdd4); stroke-width: 1.6; }
    .ecke   { fill: var(--ink, #031121); }
    .strom  { fill: none; stroke: var(--ink, #031121); stroke-width: 2.2; }
    .finger { fill: #fcd430; stroke: var(--ink, #031121); stroke-width: 2.4; }
    .t-b    { fill: var(--ink, #031121); font-size: 21px; font-weight: 600; }
    .t      { fill: var(--ink, #031121); font-size: 19px; }
    .t-s    { fill: var(--ink-soft, #5a6472); font-size: 17px; }
  </style>

  <!-- ══ Glasfläche mit gleichmäßigem Feld ══ -->
  <rect class="glas" x="40" y="60" width="520" height="300" rx="6"/>
  <g class="feld">
    <line x1="40" y1="110" x2="560" y2="110"/>
    <line x1="40" y1="160" x2="560" y2="160"/>
    <line x1="40" y1="210" x2="560" y2="210"/>
    <line x1="40" y1="260" x2="560" y2="260"/>
    <line x1="40" y1="310" x2="560" y2="310"/>
  </g>
  <text class="t-s" x="40" y="42">gleichmäßiges elektrisches Feld über dem Glas</text>

  <!-- ══ Ecken mit Abgriff ══ -->
  <circle class="ecke" cx="40"  cy="60"  r="9"/>
  <circle class="ecke" cx="560" cy="60"  r="9"/>
  <circle class="ecke" cx="40"  cy="360" r="9"/>
  <circle class="ecke" cx="560" cy="360" r="9"/>

  <!-- ══ Berührstelle ══ -->
  <circle class="finger" cx="340" cy="230" r="22"/>

  <!-- ══ Ströme aus den vier Ecken ══ -->
  <line class="strom" x1="40"  y1="60"  x2="320" y2="216" marker-end="url(#kap-pfeil)"/>
  <line class="strom" x1="560" y1="60"  x2="360" y2="216" marker-end="url(#kap-pfeil)"/>
  <line class="strom" x1="40"  y1="360" x2="320" y2="246" marker-end="url(#kap-pfeil)"/>
  <line class="strom" x1="560" y1="360" x2="360" y2="246" marker-end="url(#kap-pfeil)"/>

  <text class="t-s" x="150" y="130">I₁</text>
  <text class="t-s" x="446" y="130">I₂</text>
  <text class="t-s" x="150" y="316">I₃</text>
  <text class="t-s" x="446" y="316">I₄</text>

  <!-- ══ Erklärung rechts ══ -->
  <g transform="translate(608,0)">
    <text class="t-b" x="0" y="96">Berührung zieht Strom</text>
    <text class="t"   x="0" y="132">Aus jeder Ecke fließt Strom zur</text>
    <text class="t"   x="0" y="158">Berührstelle. Der Controller</text>
    <text class="t"   x="0" y="184">vergleicht die vier Werte und</text>
    <text class="t"   x="0" y="210">rechnet daraus die Position.</text>

    <line x1="0" y1="248" x2="340" y2="248" stroke="var(--rule, #c7cdd4)" stroke-width="2"/>

    <text class="t-b" x="0" y="292">Die Bedingung</text>
    <text class="t-s" x="0" y="324">Der Körper muss leitfähig sein.</text>
    <text class="t-s" x="0" y="348">Ein Handschuh verschiebt keine</text>
    <text class="t-s" x="0" y="372">Ladung – und die Fläche bleibt</text>
    <text class="t-s" x="0" y="396">stumm, ohne jede Meldung.</text>
  </g>
</svg>
