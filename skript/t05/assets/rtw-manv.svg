<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 402" role="img" font-family="Inter, system-ui, sans-serif"><title>Dieselbe Aufgabe, mehrere Zeilen verschoben</title><desc>Fünf Dimensionen im Vergleich von Rettungswagen und Massenanfall.</desc><style>
.rahmen{fill:none;stroke:var(--rule,#c7cdd4);stroke-width:1.5}
.linie{stroke:var(--rule,#c7cdd4);stroke-width:1}
.kopf{fill:var(--ink,#031121);font-size:17px;font-weight:600;letter-spacing:.04em}
.dim{fill:var(--ink,#031121);font-size:21px;font-weight:600}
.wert{fill:var(--ink,#031121);font-size:19px}
.traegt{fill:var(--ink,#031121);font-size:19px;font-weight:600}
.nr{fill:var(--ink,#031121);font-size:15px;font-weight:600}
.sub{fill:var(--ink-soft,#5a6472);font-size:16px}
.zahl{fill:var(--ink,#031121);font-size:24px;font-weight:600}
.marke{fill:#fcd430}
.balken{fill:var(--ink,#031121)}
.balken-s{fill:var(--ink-soft,#5a6472)}
.balken-h{fill:var(--rule,#c7cdd4)}
.balken-m{fill:#fcd430}
</style><rect class="rahmen" x="0.75" y="0.75" width="998.5" height="400.5"/><text class="kopf" x="70" y="30">DIMENSION</text><text class="kopf" x="300" y="30">RETTUNGSWAGEN</text><text class="kopf" x="650" y="30">MANV</text><line class="linie" x1="0" y1="46" x2="1000" y2="46"/><rect class="marke" x="24" y="60" width="4" height="42"/><text class="nr" x="42" y="88">1</text><text class="dim" x="70" y="88">Umgebung</text><text class="wert" x="300" y="88">Fahrzeug</text><text class="traegt" x="650" y="88">Einsatzstelle, Funk überlastet</text><line class="linie" x1="24" y1="116" x2="976" y2="116"/><rect class="marke" x="24" y="130" width="4" height="42"/><text class="nr" x="42" y="158">2</text><text class="dim" x="70" y="158">Nutzerspektrum</text><text class="wert" x="300" y="158">Eine Einsatzkraft kennt den Fall</text><text class="traegt" x="650" y="158">Wechselnde Teams</text><line class="linie" x1="24" y1="186" x2="976" y2="186"/><rect class="marke" x="24" y="200" width="4" height="42"/><text class="nr" x="42" y="228">3</text><text class="dim" x="70" y="228">Aufgabentyp</text><text class="wert" x="300" y="228">Volles Protokoll</text><text class="traegt" x="650" y="228">Kategorie, ID; erst später mehr</text><line class="linie" x1="24" y1="256" x2="976" y2="256"/><rect class="marke" x="24" y="270" width="4" height="42"/><text class="nr" x="42" y="298">4</text><text class="dim" x="70" y="298">Fehlerkosten</text><text class="wert" x="300" y="298">Eine Person</text><text class="traegt" x="650" y="298">Alle: Lagebild und Reihenfolge</text><line class="linie" x1="24" y1="326" x2="976" y2="326"/><rect class="marke" x="24" y="340" width="4" height="42"/><text class="nr" x="42" y="368">5</text><text class="dim" x="70" y="368">Rechtsrahmen</text><text class="wert" x="300" y="368">Volle Vorgaben</text><text class="traegt" x="650" y="368">Am Anfang reduziert (Saarland)</text></svg>
