<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 382" role="img" font-family="Inter, system-ui, sans-serif"><title>Rettungswagen: Nutzerspektrum</title><desc>Notfallsanitäter, täglich: Strukturiertes Formular; Notarzt behandelt, andere schreiben: Schreiben delegieren, Verantwortung bleibt; Angehörige wissen die Medikamente: Erfragen, Medikationsplan abfotografieren; Patient lehnt den Transport ab: Nur Unterschrift, dazu Zeugen</desc><style>
.rahmen{fill:none;stroke:var(--rule,#c7cdd4);stroke-width:1.5}
.linie{stroke:var(--rule,#c7cdd4);stroke-width:1}
.kopf{fill:var(--ink,#031121);font-size:17px;font-weight:600;letter-spacing:.04em}
.dim{fill:var(--ink,#031121);font-size:21px;font-weight:600}
.wert{fill:var(--ink,#031121);font-size:19px}
.traegt{fill:var(--ink,#031121);font-size:19px;font-weight:600}
.nr{fill:var(--ink,#031121);font-size:15px;font-weight:600}
.sub{fill:var(--ink-soft,#5a6472);font-size:16px}
.zahl{fill:var(--ink,#031121);font-size:24px;font-weight:600}
.marke{fill:#fcd430}
.balken{fill:var(--ink,#031121)}
.balken-s{fill:var(--ink-soft,#5a6472)}
.balken-h{fill:var(--rule,#c7cdd4)}
.balken-m{fill:#fcd430}
</style><rect class="rahmen" x="0.75" y="0.75" width="998.5" height="346.5"/><text class="kopf" x="42" y="30">KONTEXT</text><text class="kopf" x="510" y="30">LÖSUNG</text><line class="linie" x1="0" y1="46" x2="1000" y2="46"/><text class="wert" x="42" y="90">Notfallsanitäter, täglich</text><text class="wert" x="510" y="90">Strukturiertes Formular</text><line class="linie" x1="24" y1="120" x2="976" y2="120"/><rect class="marke" x="24" y="134" width="4" height="46"/><text class="wert" x="42" y="164">Notarzt behandelt, andere schreiben</text><text class="traegt" x="510" y="164">Schreiben delegieren, Verantwortung bleibt</text><line class="linie" x1="24" y1="194" x2="976" y2="194"/><rect class="marke" x="24" y="208" width="4" height="46"/><text class="wert" x="42" y="238">Angehörige wissen die Medikamente</text><text class="traegt" x="510" y="238">Erfragen, Medikationsplan abfotografieren</text><line class="linie" x1="24" y1="268" x2="976" y2="268"/><rect class="marke" x="24" y="282" width="4" height="46"/><text class="wert" x="42" y="312">Patient lehnt den Transport ab</text><text class="traegt" x="510" y="312">Nur Unterschrift, dazu Zeugen</text><text class="sub" x="0" y="372">Konstruierter Fall, von der Praxis gegenzulesen</text></svg>
