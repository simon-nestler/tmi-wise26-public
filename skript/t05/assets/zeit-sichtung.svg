<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 322" role="img" font-family="Inter, system-ui, sans-serif"><title>Sichtung: Papier gegen Handheld</title><desc>Papier: 26 s; Handheld: 36 s; Handheld ohne erste: 31 s. Mittelwerte je Sichtung, 12 Einsatzkräfte in 6 Teams, Übung Feuerwache 6 München (Nestler 2010)</desc><style>
