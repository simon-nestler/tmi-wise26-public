<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 374" role="img" font-family="Inter, system-ui, sans-serif"><title>Sichtung: Papier, Nummer und RFID</title><desc>Papier: 19.0 s; RFID einfach: 25.9 s; Nummer: 26.1 s; RFID doppelt: 29.4 s. 16 Einsatzkräfte, 384 Sichtungen in einer Übung. Papier ohne elektronische Liste (Nestler et al. 2011)</desc><style>
.rahmen{fill:none;stroke:var(--rule,#c7cdd4);stroke-width:1.5}
.linie{stroke:var(--rule,#c7cdd4);stroke-width:1}
.kopf{fill:var(--ink,#031121);font-size:17px;font-weight:600;letter-spacing:.04em}
.dim{fill:var(--ink,#031121);font-size:21px;font-weight:600}
.wert{fill:var(--ink,#031121);font-size:19px}
.traegt{fill:var(--ink,#031121);font-size:19px;font-weight:600}
.nr{fill:var(--ink,#031121);font-size:15px;font-weight:600}
.sub{fill:var(--ink-soft,#5a6472);font-size:16px}
.zahl{fill:var(--ink,#031121);font-size:24px;font-weight:600}
.marke{fill:#fcd430}
.balken{fill:var(--ink,#031121)}
.balken-s{fill:var(--ink-soft,#5a6472)}
.balken-h{fill:var(--rule,#c7cdd4)}
.balken-m{fill:#fcd430}
</style><text class="dim" x="0" y="48">Papier</text><text class="sub" x="0" y="72">± 8,2 s</text><rect class="balken-s" x="290" y="24" width="311.4" height="52"/><text class="zahl" x="613" y="58">19,0 s</text><text class="dim" x="0" y="124">RFID einfach</text><text class="sub" x="0" y="148">± 10,6 s</text><rect class="balken" x="290" y="100" width="424.5" height="52"/><text class="zahl" x="726" y="134">25,9 s</text><text class="dim" x="0" y="200">Nummer</text><text class="sub" x="0" y="224">± 14,9 s</text><rect class="balken" x="290" y="176" width="427.8" height="52"/><text class="zahl" x="730" y="210">26,1 s</text><text class="dim" x="0" y="276">RFID doppelt</text><text class="sub" x="0" y="300">± 11,4 s</text><rect class="balken" x="290" y="252" width="481.8" height="52"/><text class="zahl" x="784" y="286">29,4 s</text><text class="sub" x="0" y="366">16 Einsatzkräfte, 384 Sichtungen in einer Übung. Papier ohne elektronische Liste (Nestler et al. 2011)</text></svg>
