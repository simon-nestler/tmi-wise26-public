<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 382" role="img" font-family="Inter, system-ui, sans-serif"><title>Rettungswagen: Rechtsrahmen</title><desc>Saarland (Dienstanweisung): DIVI-Protokoll, Durchschläge, 10 Jahre; Bayern, Art. 46 BayRDG: Übergabe und zusätzlich digital; Änderung, § 630f BGB: Ursprung und Zeitpunkt bleiben erkennbar; Massenanfall (Saarland): Am Anfang deutlich reduzierte Vorgaben</desc><style>
.rahmen{fill:none;stroke:var(--rule,#c7cdd4);stroke-width:1.5}
.linie{stroke:var(--rule,#c7cdd4);stroke-width:1}
.kopf{fill:var(--ink,#031121);font-size:17px;font-weight:600;letter-spacing:.04em}
.dim{fill:var(--ink,#031121);font-size:21px;font-weight:600}
.wert{fill:var(--ink,#031121);font-size:19px}
.traegt{fill:var(--ink,#031121);font-size:19px;font-weight:600}
.nr{fill:var(--ink,#031121);font-size:15px;font-weight:600}
.sub{fill:var(--ink-soft,#5a6472);font-size:16px}
.zahl{fill:var(--ink,#031121);font-size:24px;font-weight:600}
.marke{fill:#fcd430}
.balken{fill:var(--ink,#031121)}
.balken-s{fill:var(--ink-soft,#5a6472)}
.balken-h{fill:var(--rule,#c7cdd4)}
.balken-m{fill:#fcd430}
</style><rect class="rahmen" x="0.75" y="0.75" width="998.5" height="346.5"/><text class="kopf" x="42" y="30">KONTEXT</text><text class="kopf" x="510" y="30">LÖSUNG</text><line class="linie" x1="0" y1="46" x2="1000" y2="46"/><text class="wert" x="42" y="90">Saarland (Dienstanweisung)</text><text class="wert" x="510" y="90">DIVI-Protokoll, Durchschläge, 10 Jahre</text><line class="linie" x1="24" y1="120" x2="976" y2="120"/><rect class="marke" x="24" y="134" width="4" height="46"/><text class="wert" x="42" y="164">Bayern, Art. 46 BayRDG</text><text class="traegt" x="510" y="164">Übergabe und zusätzlich digital</text><line class="linie" x1="24" y1="194" x2="976" y2="194"/><rect class="marke" x="24" y="208" width="4" height="46"/><text class="wert" x="42" y="238">Änderung, § 630f BGB</text><text class="traegt" x="510" y="238">Ursprung und Zeitpunkt bleiben erkennbar</text><line class="linie" x1="24" y1="268" x2="976" y2="268"/><rect class="marke" x="24" y="282" width="4" height="46"/><text class="wert" x="42" y="312">Massenanfall (Saarland)</text><text class="traegt" x="510" y="312">Am Anfang deutlich reduzierte Vorgaben</text><text class="sub" x="0" y="372">Keine Rechtsberatung; Länder regeln verschieden</text></svg>
