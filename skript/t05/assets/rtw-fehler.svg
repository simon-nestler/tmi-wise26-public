<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 382" role="img" font-family="Inter, system-ui, sans-serif"><title>Rettungswagen: Fehlerkosten</title><desc>Unleserliche Dosis: Auswahl und feste Einheit statt Freitext; Eintrag fehlt: Gilt zunächst als nicht durchgeführt; Reanimation: Schreiben kostet Hände: Erst behandeln, dann aus der Erinnerung; Papier und Gerät widersprechen sich: Vorher festlegen, was gilt</desc><style>
.rahmen{fill:none;stroke:var(--rule,#c7cdd4);stroke-width:1.5}
.linie{stroke:var(--rule,#c7cdd4);stroke-width:1}
.kopf{fill:var(--ink,#031121);font-size:17px;font-weight:600;letter-spacing:.04em}
.dim{fill:var(--ink,#031121);font-size:21px;font-weight:600}
.wert{fill:var(--ink,#031121);font-size:19px}
.traegt{fill:var(--ink,#031121);font-size:19px;font-weight:600}
.nr{fill:var(--ink,#031121);font-size:15px;font-weight:600}
.sub{fill:var(--ink-soft,#5a6472);font-size:16px}
.zahl{fill:var(--ink,#031121);font-size:24px;font-weight:600}
.marke{fill:#fcd430}
.balken{fill:var(--ink,#031121)}
.balken-s{fill:var(--ink-soft,#5a6472)}
.balken-h{fill:var(--rule,#c7cdd4)}
.balken-m{fill:#fcd430}
</style><rect class="rahmen" x="0.75" y="0.75" width="998.5" height="346.5"/><text class="kopf" x="42" y="30">KONTEXT</text><text class="kopf" x="510" y="30">LÖSUNG</text><line class="linie" x1="0" y1="46" x2="1000" y2="46"/><rect class="marke" x="24" y="60" width="4" height="46"/><text class="wert" x="42" y="90">Unleserliche Dosis</text><text class="traegt" x="510" y="90">Auswahl und feste Einheit statt Freitext</text><line class="linie" x1="24" y1="120" x2="976" y2="120"/><rect class="marke" x="24" y="134" width="4" height="46"/><text class="wert" x="42" y="164">Eintrag fehlt</text><text class="traegt" x="510" y="164">Gilt zunächst als nicht durchgeführt</text><line class="linie" x1="24" y1="194" x2="976" y2="194"/><rect class="marke" x="24" y="208" width="4" height="46"/><text class="wert" x="42" y="238">Reanimation: Schreiben kostet Hände</text><text class="traegt" x="510" y="238">Erst behandeln, dann aus der Erinnerung</text><line class="linie" x1="24" y1="268" x2="976" y2="268"/><rect class="marke" x="24" y="282" width="4" height="46"/><text class="wert" x="42" y="312">Papier und Gerät widersprechen sich</text><text class="traegt" x="510" y="312">Vorher festlegen, was gilt</text><text class="sub" x="0" y="372">Konstruierter Fall, von der Praxis gegenzulesen</text></svg>
