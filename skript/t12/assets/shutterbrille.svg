<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img"
     aria-labelledby="shb-titel shb-beschr" font-family="inherit">
  <title id="shb-titel">Die aktive Shutterbrille</title>
  <desc id="shb-beschr">Der Fernseher zeigt abwechselnd das Bild für das linke und das für das rechte Auge. Ein Sender am Gerät taktet die Brille dazu passend: Während das linke Bild steht, ist nur das linke Glas durchsichtig und das rechte dunkel; beim nächsten Bild ist es umgekehrt. Jedes Auge bekommt damit nur die Hälfte der Bilder, und wer keine Brille trägt, sieht beide Bilder übereinander.</desc>

  <defs>
    <marker id="shb-pfeil" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-soft, #5a6472)"/>
    </marker>
  </defs>

  <style>
    .geraet  { fill: var(--paper, #ffffff); stroke: var(--ink, #031121); stroke-width: 2.4; }
    .schirm  { fill: var(--rule, #c7cdd4); stroke: var(--ink, #031121); stroke-width: 2; }
    .offen   { fill: var(--paper, #ffffff); stroke: var(--ink, #031121); stroke-width: 2.6; }
    .zu      { fill: var(--ink, #031121); stroke: var(--ink, #031121); stroke-width: 2.6; }
    .buegel  { fill: none; stroke: var(--ink, #031121); stroke-width: 2.6; }
    .funk    { fill: none; stroke: var(--ink-soft, #5a6472); stroke-width: 2; }
    .t-b     { fill: var(--ink, #031121); font-size: 21px; font-weight: 600; }
    .t       { fill: var(--ink, #031121); font-size: 19px; }
    .t-s     { fill: var(--ink-soft, #5a6472); font-size: 17px; }
    .auge    { fill: var(--ink, #031121); font-size: 20px; font-weight: 600; }
  </style>

  <!-- ══ Takt 1: linkes Bild ══ -->
  <g transform="translate(20,0)">
    <text class="t-b" x="0" y="34">Takt 1</text>
    <text class="t-s" x="84" y="34">Bild für das linke Auge</text>

    <rect class="geraet" x="0" y="56" width="250" height="160" rx="5"/>
    <rect class="schirm" x="14" y="70" width="222" height="132" rx="2"/>
    <text class="auge" x="125" y="146" text-anchor="middle">L</text>
    <rect class="geraet" x="100" y="216" width="50" height="12"/>

    <path class="funk" d="M262 100 q 22 30 0 60"/>
    <path class="funk" d="M282 88  q 32 42 0 84"/>
    <text class="t-s" x="258" y="208">Sender</text>

    <g transform="translate(330,116)">
      <rect class="offen" x="0"  y="0" width="60" height="44" rx="6"/>
      <rect class="zu"    x="70" y="0" width="60" height="44" rx="6"/>
      <line class="buegel" x1="60" y1="18" x2="70" y2="18"/>
      <path class="buegel" d="M0 12 H -18"/>
      <path class="buegel" d="M130 12 H 148"/>
      <text class="t-s" x="30"  y="68" text-anchor="middle">offen</text>
      <text class="t-s" x="100" y="68" text-anchor="middle">dunkel</text>
    </g>
  </g>

  <!-- ══ Takt 2: rechtes Bild ══ -->
  <g transform="translate(520,0)">
    <text class="t-b" x="0" y="34">Takt 2</text>
    <text class="t-s" x="84" y="34">Bild für das rechte Auge</text>

    <rect class="geraet" x="0" y="56" width="250" height="160" rx="5"/>
    <rect class="schirm" x="14" y="70" width="222" height="132" rx="2"/>
    <text class="auge" x="125" y="146" text-anchor="middle">R</text>
    <rect class="geraet" x="100" y="216" width="50" height="12"/>

    <path class="funk" d="M262 100 q 22 30 0 60"/>
    <path class="funk" d="M282 88  q 32 42 0 84"/>
    <text class="t-s" x="258" y="208">Sender</text>

    <g transform="translate(330,116)">
      <rect class="zu"    x="0"  y="0" width="60" height="44" rx="6"/>
      <rect class="offen" x="70" y="0" width="60" height="44" rx="6"/>
      <line class="buegel" x1="60" y1="18" x2="70" y2="18"/>
      <path class="buegel" d="M0 12 H -18"/>
      <path class="buegel" d="M130 12 H 148"/>
      <text class="t-s" x="30"  y="68" text-anchor="middle">dunkel</text>
      <text class="t-s" x="100" y="68" text-anchor="middle">offen</text>
    </g>
  </g>

  <line x1="20" y1="290" x2="980" y2="290" stroke="var(--rule, #c7cdd4)" stroke-width="2"/>

  <text class="t"   x="20" y="330">Beide Takte laufen schneller, als das Auge folgen kann. Der Preis steht auf der Nase.</text>
  <text class="t-s" x="20" y="362">Jedes Auge sieht nur jedes zweite Bild · die Brille braucht Strom und wiegt · sie verdunkelt auch im offenen Zustand</text>
  <text class="t-s" x="20" y="386">· und jede weitere Person im Raum braucht eine eigene.</text>
</svg>
