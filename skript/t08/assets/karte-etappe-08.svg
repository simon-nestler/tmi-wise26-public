<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 851" role="img" aria-labelledby="t d">
  <title id="t">Der Semesterplan TMI: Auftakt, 13 Themen mit Teil A und Teil B, drei Anker, das Praktikum von KW41 bis KW48, Klausurzulassung und Klausur</title>
  <desc id="d">Hervorgehoben (gelber Rahmen, Marke HEUTE): Feld 8. Vierzehn Felder in drei Reihen, von links nach rechts zu lesen. Woche 1 ist der Auftakt T00 am Montag, 5.10., gestrichelt. Dann die Themen: 1 Messung und Vermutung; 2 Warum Konzepte scheitern; 3 Touch, Zielgrößen und Verdeckung; 4 Maus, Tastatur und Wertgeber, streichbar als erstes; 5 Anker 1, das Kontextraster; 6 Spracheingabe und ihre Fehlerquellen; 7 Blick, Muskel und Gesicht; 8 Displays und die Grenzen des Auges, streichbar als zweites; 9 Ton und Haptik; 10 Anker 2, Modalitätswahl unter Rollen; 11 Tracking und seine Störungen; 12 Sichtfeld und Latenz; 13 Anker 3, Technik und Recht. Die Anker 5, 10 und 13 sind dunkelblau. Jedes Thema hat Teil A und Teil B à 90 Minuten. Ein hellblauer Streifen unter Auftakt und Themen 1 bis 5 markiert das Praktikum: Aufgaben VA01 bis VA06 in KW41 bis KW46, vom 5.10. bis 12.11., mit v4-Tutorial am Montag, 12.10. Unter Thema 6 ein gestrichelter Reservetermin in KW47, unter Thema 7 der Hackathon in KW48. Gelbe Marken: Klausurzulassung nach allen sechs Aufgaben, Klausur mit 90 Minuten im Prüfungszeitraum. Ein gestricheltes Feld nach Thema 13: Kommt eine Woche hinzu, wird sie Fragestunde.</desc>
