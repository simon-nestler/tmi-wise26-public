<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img"
     aria-labelledby="hkl-titel hkl-beschr" font-family="inherit">
  <title id="hkl-titel">Force Feedback ist eine Schleife, keine Ausgabe</title>
  <desc id="hkl-beschr">Ein Kreislauf aus vier Stationen. Der Mensch bewegt ein haptisches Gerät. Das Gerät meldet die Bewegung als Zahlenwert an den Rechner. Der Rechner berechnet daraus eine Kraft und schickt sie zurück an das Gerät. Das Gerät setzt sie als Gegenkraft um, die der Mensch spürt. Der obere Weg trägt die Bewegung hinein, der untere die Kraft zurück; beide laufen ununterbrochen.</desc>

  <defs>
    <marker id="hkl-pfeil" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #031121)"/>
    </marker>
  </defs>

  <style>
    .kasten  { fill: var(--paper, #ffffff); stroke: var(--ink, #031121); stroke-width: 2.4; }
    .weg     { fill: none; stroke: var(--ink, #031121); stroke-width: 2.4; }
    .t-b     { fill: var(--ink, #031121); font-size: 22px; font-weight: 600; }
    .t       { fill: var(--ink, #031121); font-size: 19px; }
    .t-s     { fill: var(--ink-soft, #5a6472); font-size: 17px; }
  </style>

  <!-- ══ die drei Stationen ══ -->
  <rect class="kasten" x="40"  y="140" width="220" height="100" rx="4"/>
  <text class="t-b" x="150" y="182" text-anchor="middle">Mensch</text>
  <text class="t-s" x="150" y="210" text-anchor="middle">Hand, Arm, Gelenk</text>

  <rect class="kasten" x="390" y="140" width="220" height="100" rx="4"/>
  <text class="t-b" x="500" y="182" text-anchor="middle">Gerät</text>
  <text class="t-s" x="500" y="210" text-anchor="middle">Motoren und Gestänge</text>

  <rect class="kasten" x="740" y="140" width="220" height="100" rx="4"/>
  <text class="t-b" x="850" y="182" text-anchor="middle">Rechner</text>
  <text class="t-s" x="850" y="210" text-anchor="middle">Modell der Szene</text>

  <!-- ══ oberer Weg: die Bewegung geht hinein ══ -->
  <path class="weg" d="M150 140 V 74 H 500 V 140" marker-end="url(#hkl-pfeil)"/>
  <text class="t"   x="325" y="62" text-anchor="middle">Bewegung</text>
  <text class="t-s" x="325" y="40" text-anchor="middle">die Hand führt</text>

  <path class="weg" d="M500 140 V 74 H 850 V 140" marker-end="url(#hkl-pfeil)"/>
  <text class="t"   x="675" y="62" text-anchor="middle">Position als Zahl</text>
  <text class="t-s" x="675" y="40" text-anchor="middle">gemessen</text>

  <!-- ══ unterer Weg: die Kraft kommt zurück ══ -->
  <path class="weg" d="M850 240 V 306 H 500 V 240" marker-end="url(#hkl-pfeil)"/>
  <text class="t"   x="675" y="330" text-anchor="middle">Kraft als Zahl</text>
  <text class="t-s" x="675" y="352" text-anchor="middle">berechnet</text>

  <path class="weg" d="M500 240 V 306 H 150 V 240" marker-end="url(#hkl-pfeil)"/>
  <text class="t"   x="325" y="330" text-anchor="middle">Gegenkraft</text>
  <text class="t-s" x="325" y="352" text-anchor="middle">der Arm spürt sie</text>
</svg>
