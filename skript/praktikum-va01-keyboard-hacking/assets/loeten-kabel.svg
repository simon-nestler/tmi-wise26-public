<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" role="img" aria-label="Zwei kurze Kabel werden zu einem längeren Kabel verlötet">
  <!-- Zwei kurze Kabel (links) -->
  <line x1="60" y1="65" x2="320" y2="65" stroke="#0B1320" stroke-width="14" stroke-linecap="round"/>
  <line x1="60" y1="100" x2="320" y2="100" stroke="#5A6472" stroke-width="14" stroke-linecap="round"/>
  <!-- Pfeil (THI-Gelb als Akzent) -->
  <path d="M 380 68 L 450 68 L 450 52 L 500 82 L 450 112 L 450 96 L 380 96 Z"
        fill="#FCD430" stroke="#0B1320" stroke-width="2"/>
  <!-- Ein längeres Kabel (rechts), Lötstelle in der Mitte -->
  <line x1="545" y1="82" x2="695" y2="82" stroke="#0B1320" stroke-width="14" stroke-linecap="round"/>
  <line x1="695" y1="82" x2="845" y2="82" stroke="#5A6472" stroke-width="14" stroke-linecap="round"/>
  <circle cx="695" cy="82" r="11" fill="#FCD430" stroke="#0B1320" stroke-width="2"/>
</svg>
